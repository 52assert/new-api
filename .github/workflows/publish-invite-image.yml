name: Publish invite image

on:
  push:
    branches:
      - feature/admin-invite-codes
  workflow_dispatch:

jobs:
  build:
    name: Build and push amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:invite-latest
            ghcr.io/${{ github.repository }}:invite-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
